<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | SendIt</title>
    <meta name="robots" content="noindex, follow" />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .card {
        width: 100%;
        max-width: 560px;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 24px 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 48px;
        color: #2563eb;
      }
      p {
        margin: 0 0 14px;
        color: #475569;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
      a {
        text-decoration: none;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 12px;
        color: #0f172a;
        font-weight: 600;
      }
      a:hover {
        border-color: #2563eb;
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404</h1>
      <p>Page not found. Continue from one of the pages below.</p>
      <div class="links">
        <a href="/">Home</a>
        <a href="/send">Send File</a>
        <a href="/receive">Receive File</a>
        <a href="/faq">FAQ</a>
      </div>
    </main>
  </body>
</html>
