      <header>
        <h1>SendIt: Temporary File Sharing and Code Sharing Platform</h1>
        <p>
          SendIt is a web application for temporary digital sharing. It helps users send files and
          code snippets using short access codes and expiry-based retrieval instead of long public
          links. This makes the platform easier to explain and easier to use for classmates,
          teammates, clients, and general web users who need a short-lived transfer workflow.
        </p>
      </header>
      <main>
        <section>
          <h2>How SendIt Works</h2>
          <p>
            A sender uploads one or more files, or submits a code snippet, then receives a short
            access code. The receiver visits the matching receive page, enters that code, and
            retrieves the shared content before the expiry period ends. SendIt is designed for
            temporary sharing rather than permanent storage, which makes it suitable for assignments,
            document handoffs, code snippets, and quick file exchange between devices.
          </p>
        </section>
        <section>
          <h2>Key Features</h2>
          <ul>
            <li>Temporary file sharing with expiry options</li>
            <li>Single and multiple file uploads</li>
            <li>Code snippet sharing with short access codes</li>
            <li>Responsive interface for mobile and desktop devices</li>
            <li>Privacy policy, terms, disclaimer, FAQ, and contact pages</li>
          </ul>
        </section>
